<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    GeoDistrito
  </title>

    <!-- LEAFLET -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    >
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    >
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    >

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="styles/styles.css"
  >

</head>

<body>

<div class="app-container">

<div class="app-header">
  <div class="header-brand">
    <span class="header-logo">📍</span>
    <span class="header-title">GeoDistrito</span>
  </div>
  <nav class="header-nav">
    <a
    id="adminLink"
    href="admin.html"
    class="topbar-link"
>
    Administración
</a>
    <span id="currentUser" class="user-badge">Invitado</span>
    <button id="btnLogout" class="logout-btn">Cerrar sesión</button>
  </nav>
</div>

    <!-- MAIN -->
    <main class="main-grid">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <!-- FORMULARIO -->
            <section class="card">

                <h2>
                  Registrar Punto
                </h2>

                <!-- TIPO -->
                <select id="pointType">

                    <option value="bardas">
                      Bardas
                    </option>

                    <option value="lonas">
                      Lonas
                    </option>

                    <option value="comites">
                      Comités
                    </option>

                    <option value="casillas">
                      Casillas
                    </option>

                </select>

                <!-- URL -->
                <input
                    type="text"
                    id="imageUrl"
                    placeholder="URL de imagen"
                >

                <!-- IMAGEN -->
                <input
                    type="file"
                    id="imageUpload"
                    accept="image/*"
                >

                <!-- PREVIEW -->
                <img
                    id="imagePreview"
                    style="
                      width:100%;
                      display:none;
                      border-radius:12px;
                      margin-top:10px;
                    "
                >

                <!-- LINK MAPS -->
                <input
                    type="text"
                    id="locationLink"
                    placeholder="Link Google Maps"
                >

                <!-- BOTÓN LINK -->
                <button id="btnLoadLink">

                    Cargar ubicación desde link

                </button>

                <!-- CAMPOS COMITÉS -->
                <div
                  id="committeeFields"
                  style="display:none;"
                >

                    <input
                        type="text"
                        id="encargado"
                        placeholder="Encargado"
                    >

                </div>

                <!-- UBICACIÓN -->
                <div class="location-data">

                    <p>
                      <strong>Latitud:</strong>
                      <span id="lat">-</span>
                    </p>

                    <p>
                      <strong>Longitud:</strong>
                      <span id="lng">-</span>
                    </p>

                    <p>
                      <strong>Distrito:</strong>
                      <span id="nearest-district">-</span>
                    </p>

                    <p>
                      <strong>Sección:</strong>
                      <span id="nearest-section">-</span>
                    </p>

                    <p>
                      <strong>Calle:</strong>
                      <span id="street">-</span>
                    </p>

                    <p>
                      <strong>Colonia:</strong>
                      <span id="neighborhood">-</span>
                    </p>

                    <p>
                      <strong>Municipio:</strong>
                      <span id="municipio">-</span>
                    </p>

                </div>

                <!-- BOTONES -->
                <button id="btnLocate">

                    Encontrar ubicación

                </button>

                <button id="btnSave">

                    Guardar punto

                </button>

                <section class="card">
                  <h2>Vista de mapa</h2>
                  <div class="map-toggle-group">
                    <button id="btnMapMarkers" class="btn-secondary btn-active">Marcadores</button>
                    <button id="btnMapClusters" class="btn-secondary">Clusters</button>
                    <button id="btnMapHeat" class="btn-secondary">Heatmap</button>
                  </div>
                </section>

            </section>


        </aside>

        <!-- MAPA -->
        <section class="map-section">

            <div id="map"></div>

        </section>

    </main>


</div>

<!-- LIBRERÍAS CDN (Global) -->

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.0/proj4.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- APLICACIÓN (ES Modules) -->

<script type="module" src="src/app.js"></script>

</body>

</html>
