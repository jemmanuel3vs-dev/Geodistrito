<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoDistrito - Login</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body class="login-page">
<div class="login-shell">
  <main class="login-card">
    <div class="login-brand">
      <span class="login-logo">GeoDistrito</span>
      <h1>Panel de acceso</h1>
      <p>Inicia sesión para administrar la plataforma.</p>
    </div>

    <form id="loginForm" class="login-form">
      <label for="email">Correo</label>
      <input id="email" type="email" placeholder="tu@correo.com" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="Contraseña" required>

      <div id="loginMessage" class="login-message"></div>

      <button type="submit" id="btnLogin">Iniciar sesión</button>
    </form>
  </main>
</div>

<script type="module" src="src/pages/login.page.js"></script>
</body>
</html>
