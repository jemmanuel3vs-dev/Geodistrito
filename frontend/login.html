<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoDistrito - Login</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
<div class="app-container">
  <header class="topbar">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;">
      <div>
        <h1>GeoDistrito</h1>
        <p>Inicia sesión para acceder al panel administrativo.</p>
      </div>
      <a href="index.html" class="topbar-link">Ver mapa</a>
    </div>
  </header>

  <main class="main-grid">
    <section class="card" style="max-width:460px;margin:auto;">
      <h2>Login</h2>
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="tu@correo.com" required>

        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="Contraseña" required>

        <div id="loginMessage" class="login-message"></div>

        <button type="submit" id="btnLogin">Iniciar sesión</button>
      </form>
    </section>
  </main>
</div>

<script type="module" src="src/pages/login.page.js"></script>
</body>
</html>
